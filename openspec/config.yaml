schema: spec-driven

context: |
  Success Betting — персональная система сбора футбольных данных, исследования
  моделей, live-сигналов в Telegram и учёта ставок. Публичного приложения нет.
  Стек: Python, psycopg, PostgreSQL, pandas/NumPy/PyArrow, LightGBM/scikit-learn,
  joblib; Node.js, Playwright/Chromium для Fonbet; cron/systemd, Docker, pytest.
  Источники: API-Football, браузерные страницы Fonbet; отдельно присутствует
  сбор API-Basketball. Telegram — интерфейс владельца и канал уведомлений.
  Baseline от 2026-11-18 восстановлен по локальной рабочей папке, включая
  незакоммиченные файлы. Он не удостоверяет состояние production.
  Основные документы: docs/architecture.md, docs/data-model.md, docs/api.md.
  Спецификации фиксируют существующее поведение, а не задания на его повторную
  реализацию. Расхождения со старыми specs/ отмечаются явно; документирование
  спорного поведения не означает его продуктовое одобрение.
  Сохранять происхождение и время наблюдений; различать NULL и ноль, исходные
  данные и признаки, состояние матча и состояние доставки.
  Ограничения: квоты API, ресурсы общего сервера, изменчивость DOM Fonbet,
  неопределённая доставка Telegram, неполная воспроизводимость ML-артефактов.
  Секреты, .env, приватные ключи и браузерный профиль не включать в документы.
  Production-изменения, миграции и сбор требуют отдельной авторизации.

rules:
  specs:
    - Писать по-русски; использовать Requirement и Scenario с WHEN/THEN.
    - Указывать ссылки на реализацию и применимые тесты.
    - Различать подтверждённый код, документированный процесс и неизвестное.
    - Наличие теста не означает, что сценарий проверен текущим прогоном.
  proposal:
    - Отделять изменение поведения от описания существующей реализации.
  design:
    - Учитывать совместимость данных, идентичность матчей и временную семантику.
  tasks:
    - Не создавать задачи повторной реализации возможностей baseline.
